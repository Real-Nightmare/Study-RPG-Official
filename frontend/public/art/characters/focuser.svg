<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="fc-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#fc-bg)"/>
  <!-- Focus aura -->
  <circle cx="100" cy="100" r="80" fill="url(#fc-aura)"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="30" fill="#e8d5b7"/>
  <!-- Hair -->
  <path d="M70 80 Q100 50 130 80" fill="#2c1810"/>
  <!-- Closed eyes - deep focus -->
  <path d="M85 82 Q90 80 95 82" fill="none" stroke="#00bcd4" stroke-width="2"/>
  <path d="M105 82 Q110 80 115 82" fill="none" stroke="#00bcd4" stroke-width="2"/>
  <!-- Meditation pose -->
  <path d="M80 115 Q100 130 120 115" fill="#2d3436" stroke="#00bcd4" stroke-width="1.5"/>
  <!-- Concentration rings -->
  <circle cx="100" cy="85" r="40" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="85" r="50" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0.2"/>
  <circle cx="100" cy="85" r="60" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0.1"/>
  <!-- Timer -->
  <rect x="88" y="155" width="24" height="20" rx="4" fill="none" stroke="#00bcd4" stroke-width="1.5"/>
  <text x="100" y="169" text-anchor="middle" font-size="10" fill="#00bcd4" font-family="monospace">25:00</text>
</svg>
