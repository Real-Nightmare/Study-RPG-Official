<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="du-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#2d0a0a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#du-bg)"/>
  <!-- Crossed swords -->
  <line x1="40" y1="160" x2="160" y2="40" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="160" x2="40" y2="40" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword guards -->
  <circle cx="55" cy="145" r="4" fill="none" stroke="#ff5252" stroke-width="2"/>
  <circle cx="145" cy="145" r="4" fill="none" stroke="#ff5252" stroke-width="2"/>
  <!-- Face -->
  <circle cx="100" cy="80" r="26" fill="#e8d5b7"/>
  <!-- Determined eyes -->
  <path d="M86 76 L94 76" stroke="#ff5252" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M106 76 L114 76" stroke="#ff5252" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="90" cy="76" r="2" fill="#ff5252"/>
  <circle cx="110" cy="76" r="2" fill="#ff5252"/>
  <!-- Scar -->
  <line x1="115" y1="68" x2="125" y2="85" stroke="#ff5252" stroke-width="1" opacity="0.5"/>
  <!-- Battle aura -->
  <circle cx="100" cy="80" r="35" fill="none" stroke="#ff5252" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="80" r="45" fill="none" stroke="#ff5252" stroke-width="0.5" opacity="0.2"/>
</svg>
