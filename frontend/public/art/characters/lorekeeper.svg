<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="lk-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#lk-bg)"/>
  <!-- Hood -->
  <path d="M60 140 Q100 40 140 140" fill="#2d2d44" stroke="#e94560" stroke-width="2"/>
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="28" ry="32" fill="#e8d5b7"/>
  <!-- Eyes - glowing knowledge -->
  <circle cx="89" cy="105" r="5" fill="#e94560"/>
  <circle cx="111" cy="105" r="5" fill="#e94560"/>
  <circle cx="89" cy="105" r="2" fill="#fff"/>
  <circle cx="111" cy="105" r="2" fill="#fff"/>
  <!-- Tome -->
  <rect x="75" y="150" width="50" height="35" rx="4" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5"/>
  <line x1="100" y1="152" x2="100" y2="182" stroke="#e94560" stroke-width="1"/>
  <!-- Floating runes -->
  <text x="50" y="80" font-size="12" fill="#e94560" opacity="0.6">ᚠ</text>
  <text x="140" y="75" font-size="12" fill="#e94560" opacity="0.6">ᛟ</text>
  <text x="45" y="130" font-size="10" fill="#e94560" opacity="0.4">ᛏ</text>
</svg>
