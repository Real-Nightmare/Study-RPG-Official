<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="al-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2e1a"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="al-potion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#al-bg)"/>
  <!-- Face -->
  <circle cx="100" cy="75" r="26" fill="#e8d5b7"/>
  <!-- Hood -->
  <path d="M68 90 Q100 45 132 90" fill="#1b3a2a" stroke="#4caf50" stroke-width="1.5"/>
  <!-- Eyes - curious -->
  <circle cx="90" cy="72" r="4" fill="#4caf50"/>
  <circle cx="110" cy="72" r="4" fill="#4caf50"/>
  <circle cx="91" cy="71" r="1.5" fill="#fff"/>
  <circle cx="111" cy="71" r="1.5" fill="#fff"/>
  <!-- Smile -->
  <path d="M92 84 Q100 90 108 84" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flask -->
  <path d="M90 130 L85 170 Q100 180 115 170 L110 130 Z" fill="#1a3a2a" stroke="#4caf50" stroke-width="1.5"/>
  <ellipse cx="100" cy="155" rx="10" ry="8" fill="url(#al-potion)" opacity="0.6"/>
  <!-- Bubbles -->
  <circle cx="96" cy="148" r="2" fill="#4caf50" opacity="0.4"/>
  <circle cx="104" cy="152" r="1.5" fill="#4caf50" opacity="0.3"/>
  <!-- Floating sparkles -->
  <circle cx="45" cy="60" r="2" fill="#4caf50" opacity="0.5"/>
  <circle cx="155" cy="55" r="1.5" fill="#4caf50" opacity="0.4"/>
  <circle cx="50" cy="140" r="1" fill="#4caf50" opacity="0.3"/>
</svg>
