# =============================================================
# Study RPG frontend — Cloudflare Pages configuration
#
# How billing actually works (see pages/functions/pricing and
# pages/functions/routing in the Cloudflare docs): requests to
# STATIC assets on Pages are free and unlimited and do NOT count
# against the Workers quota — the 100k/day free limit is a shared
# pool for Workers + Pages Functions only. So this pure static
# site (no functions/ dir) never consumes that pool. public/
# _routes.json additionally excludes ALL routes from Functions
# invocation, so even if a functions/ directory is added later,
# every request stays in the free-and-unlimited static pool.
#
# NOTE: this file is mostly for local `wrangler pages deploy`
# DX. The canonical production path is the GitHub Actions
# workflow `.github/workflows/deploy-frontend-cloudflare.yml`,
# which deploys `frontend/dist` with wrangler-action.
# =============================================================

name = "study-rpg"

# Directory wrangler uploads on `wrangler pages deploy` when no
# positional directory is given (vite build output).
pages_build_output_dir = "dist"

compatibility_date = "2025-08-01"

# The frontend talks to the NestJS API directly (same-origin
# reverse proxy or CORS-allowlisted origin). We deliberately do
# NOT route /api through a Worker — see docs/deployment/hosting.md.
