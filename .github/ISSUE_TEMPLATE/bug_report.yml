name: Bug Report
description: Report a defect so the team can fix it
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this report. The more context you include, the faster we can reproduce and resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short, precise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Paste error output, console logs, or attach screenshots if available.

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web (frontend)
        - Backend API
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker Compose
        - Manual build
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash you are running.
      placeholder: e.g. v0.1.0 or a commit hash

  - type: dropdown
    id: browser
    attributes:
      label: Browser (web only)
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Environment details or other context that could matter.
