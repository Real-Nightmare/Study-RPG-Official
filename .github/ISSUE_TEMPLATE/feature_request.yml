name: Feature Request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an idea. Describe the problem you are trying to solve and the outcome you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What need or pain point does this address?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature work from the user's point of view?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI features (Exam Clone, Problem Solver, Research, ...)
        - Knowledge base & RAG
        - Quiz & flashcards
        - Study tools
        - UI/UX
        - API
        - Self-hosting / deployment
        - Internationalization (i18n)
        - Documentation
        - Performance
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important
        - Critical for my use case

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, references, or screenshots that illustrate the idea.
