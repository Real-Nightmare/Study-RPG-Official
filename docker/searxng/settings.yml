# SearXNG settings for Study RPG Deep Research (fully-local meta search).
# JSON output must be enabled — the backend queries
#   http://searxng:8080/search?q=...&format=json
use_default_settings: true

server:
  secret_key: "study-rpg-searxng-local-key"
  limiter: false   # internal-only service; no rate limiting needed
  image_proxy: false

search:
  safe_search: 1
  autocomplete: "duckduckgo"

engines:
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false

formats:
  - html
  - json
