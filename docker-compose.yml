# Study RPG — full-stack compose setup (fully local, zero external keys)
# Usage: docker compose up -d
# Frontend: http://localhost:8080   Backend API: http://localhost:3010
#
# First run: sh scripts/bootstrap.sh  (waits healthy, runs migrations,
#             pulls Ollama models, creates buckets, seeds data)

services:
  # ── Infrastructure ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: studyrpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studyrpg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyrpg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: studyrpg-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: studyrpg-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-studyrpg_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local LLM (T1) ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: studyrpg-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Local Object Storage (T3) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: studyrpg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  # ── Local SMTP (T2) ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: studyrpg-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # ── Local Web Search (T4) ────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: studyrpg-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - searxng_data:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-studyrpg-searxng-secret-change-me}

  # ── Local Code Runner (T5) ───────────────────────────────────────
  code-runner:
    build:
      context: ./docker/code-runner
      dockerfile: Dockerfile
    container_name: studyrpg-code-runner
    restart: unless-stopped
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp:size=256m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      RUNNER_PORT: ${CODE_RUNNER_PORT:-9000}
    ports:
      - "${CODE_RUNNER_PORT:-9000}:9000"

  # ── Application ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyrpg-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3010}:3010"
    env_file:
      - .env
    environment:
      NODE_ENV=production
      DATABASE_HOST=postgres
      DATABASE_PORT=5432
      DATABASE_USER=${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME=${POSTGRES_DB:-studyrpg}
      REDIS_HOST=redis
      REDIS_PORT=6379
      QDRANT_HOST=qdrant
      QDRANT_PORT=6333
      CLICKHOUSE_HOST=clickhouse
      CLICKHOUSE_PORT=8123
      # AI — Ollama local (default, no key needed)
      AI_PROVIDER=openai-compatible
      OPENAI_BASE_URL=http://ollama:11434/v1
      OPENAI_API_KEY=ollama
      OPENROUTER_DEFAULT_MODEL=qwen2.5:7b-instruct
      OPENROUTER_EMBEDDING_MODEL=nomic-embed-text
      # Reranker — local Ollama (default)
      RERANKER_PROVIDER=ollama
      RERANKER_MODEL=bge-reranker-v2-m3
      RERANKER_API_URL=http://ollama:11434
      # Storage — MinIO S3-compatible (default)
      STORAGE_PROVIDER=minio
      AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION=us-east-1
      R2_ACCOUNT_ID=minio
      R2_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      R2_BUCKET_NAME=studyrpg-uploads
      R2_PUBLIC_URL=http://minio:9000/studyrpg-uploads
      R2_ENDPOINT=http://minio:9000
      # Email — Mailpit SMTP (default)
      EMAIL_TRANSPORT=smtp
      SMTP_HOST=mailpit
      SMTP_PORT=1025
      SMTP_SECURE=false
      SMTP_USER=
      SMTP_PASS=
      EMAIL_DEFAULT_FROM=noreply@studyrpg.local
      # Web Search — SearXNG (default)
      SEARCH_PROVIDER=searxng
      SEARXNG_URL=http://searxng:8080
      # Code Runner — local sidecar
      CODE_SANDBOX_URL=http://code-runner:9000
      CODE_SANDBOX_TIMEOUT=30000
      # Push Notifications — VAPID (auto-generated)
      WEB_PUSH_ENABLED=true
      # Billing & Marketplace — OFF by default
      BILLING_ENABLED=false
      MARKETPLACE_ENABLED=false
      # CORS
      CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-8080},http://localhost:3000
      JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      JWT_ACCESS_EXPIRATION=15m
      JWT_REFRESH_EXPIRATION=7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      clickhouse:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyrpg-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      VITE_API_URL=http://localhost:${BACKEND_PORT:-3010}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  clickhouse_data:
  ollama_data:
  minio_data:
  searxng_data:
