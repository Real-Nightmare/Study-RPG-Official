# Studyield - Full Stack Setup
# Usage: docker compose --env-file .env.docker up
# Then visit http://localhost:5189 (frontend) and http://localhost:3010 (backend API)
#
# Images are pinned to current stable versions (Aug 2026):
#   postgres 18.4, redis 8.10, qdrant v1.19.0, clickhouse 26.7.3.19-stable,
#   nginx 1.30.4-alpine, node 24-alpine (build stage)
#
# SSH debug into the app containers (always on, key-based):
#   ssh -i /tmp/studyield-ssh/id_studyield_debug root@localhost -p ${BACKEND_SSH_PORT:-3022}   # backend
#   ssh -i /tmp/studyield-ssh/id_studyield_debug root@localhost -p ${FRONTEND_SSH_PORT:-3222}  # frontend
#   The debug public key is baked into the images; the private key stays out
#   of the repo. SSH_PASSWORD / SSH_PUBLIC_KEY add extra auth at runtime.
#   Keep the SSH ports bound to localhost/a VPN; do not expose them publicly.

services:
  # --- Infrastructure -----------------------------------------------
  postgres:
    image: postgres:18.4-alpine
    container_name: studyield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studyield_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: studyield-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: studyield-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3.19-stable
    container_name: studyield-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-studyield_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyield-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3010}:3010"
      - "${BACKEND_SSH_PORT:-3022}:22"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_NAME=${POSTGRES_DB:-studyield_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      # SSH debug is always on (baked-in key); these add password/extra-key auth
      - SSH_PASSWORD=${SSH_PASSWORD:-}
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyield-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5189}:80"
      - "${FRONTEND_SSH_PORT:-3222}:22"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-3010}
      # SSH debug is always on (baked-in key); these add password/extra-key auth
      - SSH_PASSWORD=${SSH_PASSWORD:-}
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  clickhouse_data:
    driver: local
